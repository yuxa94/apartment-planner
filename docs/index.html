<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대화로 만드는 공동주택 초기계획 도구 · Stage 1·2·3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
</head>
<body>
<main id="viewport"><div id="stage" aria-live="polite"></div></main>
<div id="progress"></div>
<nav id="nav" aria-label="슬라이드 이동">
  <button id="prev" aria-label="이전 슬라이드">←</button>
  <button id="next" aria-label="다음 슬라이드">→</button>
  <span id="count"></span>
  <i class="sep stage-only"></i>
  <button id="notesBtn" class="stage-only" title="N">노트</button>
  <button id="tocBtn" title="G">전체</button>
  <button id="resourcesBtn" title="R">자료실</button>
  <i class="sep"></i>
  <button id="readBtn">읽기</button>
  <button id="fullscreen" class="stage-only" title="F">전체화면</button>
  <button id="print" class="stage-only">인쇄</button>
</nav>

<div class="overlay" id="toc" role="dialog" aria-label="전체 슬라이드"><button class="close-x" data-close>닫기 · Esc</button><h3>전체 슬라이드 · G</h3><input id="search" placeholder="제목·단계로 찾기" aria-label="슬라이드 검색"><div class="ov-grid" id="tocgrid"></div></div>
<div class="overlay" id="notes" role="dialog" aria-label="강사 노트"><button class="close-x" data-close>닫기 · Esc</button><h3 id="notesTitle">강사 노트</h3><p id="notesText"></p></div>
<div class="overlay" id="lightbox" role="dialog" aria-label="이미지 확대"><button class="close-x" data-close>닫기 · Esc</button><img id="largeImage" alt="실제 CAD 또는 편집기 확대 화면"></div>
<div class="overlay" id="fallback" role="dialog" aria-label="수동 복사"><button class="close-x" data-close>닫기 · Esc</button><div class="panel"><h3>수동 복사</h3><h2>텍스트를 선택해 복사하세요</h2><p>브라우저가 자동 복사를 허용하지 않았습니다. Ctrl+A → Ctrl+C</p><textarea id="manualCopy" aria-label="복사할 요청문"></textarea></div></div>
<div id="toast" role="status"></div>

<script src="slides.js"></script>
<script src="deck.js"></script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" style="stroke:var(--quiet);stroke-width:1"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" style="fill:none;stroke:var(--ink);stroke-width:1.5"/></marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" style="fill:none;stroke:var(--accent);stroke-width:1.5"/></marker>
</defs></svg>
</body>
</html>
